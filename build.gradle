// Root build file: configures a composite project with the projects submodule
plugins {
    id 'org.springframework.boot' version '3.2.0' apply false
    id 'io.spring.dependency-management' version '1.1.0' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    group = 'com.taskbridge'
    version = '0.1.0'
    sourceCompatibility = '17'

    repositories {
        mavenCentral()
    }
}
